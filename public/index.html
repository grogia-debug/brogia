<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SysX-Forc - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="logo">
                <h1>🔥 SYSX-FORC</h1>
                <p>WhatsApp Crasher System</p>
            </div>
            
            <div class="video-profile">
                <video autoplay muted loop playsinline id="profileVideo">
                    <source src="https://www.gobox.my.id/file/Ctw42iB3HzQZ.mp4" type="video/mp4">
                </video>
            </div>

            <form id="loginForm">
                <div class="input-group">
                    <input type="password" id="password" placeholder="Masukkan Password..." required>
                    <button type="submit" id="loginBtn">🔓 LOGIN</button>
                </div>
                <div id="errorMsg" class="error"></div>
            </form>

            <div class="footer">
                <p>⚠️ ILEGAL TOOL - FOR EDUCATIONAL ONLY</p>
            </div>
        </div>
    </div>

    <!-- Animasi Login -->
    <div id="loginAnimation" class="animation-overlay" style="display:none;">
        <video autoplay muted playsinline id="animVideo">
            <source src="https://www.gobox.my.id/file/Za0FheVLP1B8.mp4" type="video/mp4">
        </video>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });

                const data = await response.json();

                if (data.success) {
                    // TAMPILIN ANIMASI
                    const animDiv = document.getElementById('loginAnimation');
                    animDiv.style.display = 'flex';
                    document.getElementById('animVideo').play();

                    setTimeout(() => {
                        window.location.href = '/dashboard.html';
                    }, 3000);
                } else {
                    errorMsg.textContent = '❌ ' + data.message;
                }
            } catch (err) {
                errorMsg.textContent = '❌ Error: ' + err.message;
            }
        });
    </script>
</body>
</html>
